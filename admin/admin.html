<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - AssetCore</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --success: #10b981;
            --danger: #ef4444;
            --border: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 20px; }
        .hidden { display: none !important; }
        
        .container { max-width: 1000px; margin: 0 auto; }
        .card { background: var(--card-bg); padding: 20px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 20px; }
        h1, h2, h3 { margin-bottom: 15px; color: var(--text); }
        
        input, select { 
            width: 100%; padding: 12px; margin-bottom: 15px; 
            background: var(--bg); border: 1px solid var(--border); 
            border-radius: 8px; color: var(--text); font-size: 14px;
        }
        
        .btn { 
            padding: 10px 20px; border: none; border-radius: 8px; 
            cursor: pointer; font-weight: 600; font-size: 14px; margin-right: 5px;
        }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-success { background: var(--success); color: #fff; }
        .btn-danger { background: var(--danger); color: #fff; }
        
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); font-size: 14px; }
        th { color: var(--text-muted); font-weight: 600; }
        
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
        .tab-btn { padding: 10px 20px; background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 16px; font-weight: 600; border-bottom: 2px solid transparent; }
        .tab-btn.active { color: var(--primary); border-bottom: 2px solid var(--primary); }
        
        .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .settings-grid label { display: block; margin-bottom: 5px; color: var(--text-muted); font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>AssetCore Admin Panel</h1>
        
        <!-- Login View -->
        <div id="login-view" class="card" style="max-width: 400px; margin: 50px auto;">
            <h2>Admin Login</h2>
            <input type="text" id="admin-user" placeholder="Username">
            <input type="password" id="admin-pass" placeholder="Password">
            <button class="btn btn-primary" style="width: 100%;" onclick="login()">Login</button>
        </div>

        <!-- Dashboard View -->
        <div id="dashboard-view" class="hidden">
            <div class="tabs">
                <button class="tab-btn active" onclick="showTab('deposits')">Pending Deposits</button>
                <button class="tab-btn" onclick="showTab('withdrawals')">Pending Withdrawals</button>
                <button class="tab-btn" onclick="showTab('history')">Transaction History</button>
                <button class="tab-btn" onclick="showTab('settings')">Settings</button>
                <button class="tab-btn" onclick="logout()" style="margin-left: auto; color: var(--danger);">Logout</button>
            </div>

            <!-- Deposits Tab -->
            <div id="tab-deposits" class="card">
                <h2>Pending Deposits</h2>
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>User ID</th>
                            <th>Amount</th>
                            <th>Txn ID</th>
                            <th>Method</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="deposits-tbody"></tbody>
                </table>
            </div>

            <!-- Withdrawals Tab -->
            <div id="tab-withdrawals" class="card hidden">
                <h2>Pending Withdrawals</h2>
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>User ID</th>
                            <th>Amount</th>
                            <th>Method</th>
                            <th>Account Details</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="withdrawals-tbody"></tbody>
                </table>
            </div>

            <!-- History Tab -->
            <div id="tab-history" class="card hidden">
                <h2>All Transactions</h2>
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Type</th>
                            <th>User ID</th>
                            <th>Amount</th>
                            <th>Method</th>
                            <th>Status</th>
                            <th>Date</th>
                        </tr>
                    </thead>
                    <tbody id="history-tbody"></tbody>
                </table>
            </div>

            <!-- Settings Tab -->
            <div id="tab-settings" class="card hidden">
                <h2>Platform Settings</h2>
                <div class="settings-grid">
                    <div>
                        <label>Registration Bonus (ETB)</label>
                        <input type="number" id="set-bonus" step="0.1">
                    </div>
                    <div>
                        <label>Commission Rate (e.g., 0.30 for 30%)</label>
                        <input type="number" id="set-comm" step="0.01">
                    </div>
                    <div>
                        <label>CBE Account Name</label>
                        <input type="text" id="set-cbe-name">
                    </div>
                    <div>
                        <label>CBE Account Number</label>
                        <input type="text" id="set-cbe-num">
                    </div>
                    <div>
                        <label>Telebirr Phone Number</label>
                        <input type="text" id="set-tb-num">
                    </div>
                </div>
                <button class="btn btn-primary" onclick="saveSettings()">Save Settings</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "http://127.0.0.1:8000";
        let token = localStorage.getItem("admin_token");

        // Check if already logged in
        if (token) {
            document.getElementById("login-view").classList.add("hidden");
            document.getElementById("dashboard-view").classList.remove("hidden");
            fetchAllData();
        }

        async function login() {
            const username = document.getElementById("admin-user").value;
            const password = document.getElementById("admin-pass").value;
            
            const formData = new URLSearchParams();
            formData.append("username", username);
            formData.append("password", password);

            try {
                const res = await fetch(`${API_URL}/api/admin/login`, {
                    method: "POST",
                    headers: { "Content-Type": "application/x-www-form-urlencoded" },
                    body: formData
                });
                
                if (res.ok) {
                    const data = await res.json();
                    token = data.access_token;
                    localStorage.setItem("admin_token", token);
                    document.getElementById("login-view").classList.add("hidden");
                    document.getElementById("dashboard-view").classList.remove("hidden");
                    fetchAllData();
                } else {
                    alert("Login failed. Check credentials.");
                }
            } catch (error) {
                console.error("Login error:", error);
            }
        }

        function logout() {
            localStorage.removeItem("admin_token");
            token = null;
            location.reload();
        }

        function authHeaders() {
            return { "Authorization": `Bearer ${token}`, "Content-Type": "application/json" };
        }

        function showTab(tabName) {
            document.querySelectorAll(".tab-btn").forEach(btn => btn.classList.remove("active"));
            event.target.classList.add("active");
            
            document.querySelectorAll("#dashboard-view > .card").forEach(tab => tab.classList.add("hidden"));
            document.getElementById(`tab-${tabName}`).classList.remove("hidden");
        }

        async function fetchAllData() {
            fetchDeposits();
            fetchWithdrawals();
            fetchHistory();
            fetchSettings();
        }

        async function fetchDeposits() {
            try {
                const res = await fetch(`${API_URL}/api/admin/pending-deposits`, { headers: authHeaders() });
                const data = await res.json();
                const tbody = document.getElementById("deposits-tbody");
                tbody.innerHTML = "";
                
                if (data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;">No pending deposits</td></tr>`;
                    return;
                }

                data.forEach(d => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${d.id}</td>
                            <td>${d.telegram_id}</td>
                            <td>${d.amount_etb} ETB</td>
                            <td>${d.transaction_id}</td>
                            <td>${d.payment_method}</td>
                            <td>${d.status}</td>
                            <td>
                                <button class="btn btn-success" onclick="approveDeposit(${d.id})">Approve</button>
                                <button class="btn btn-danger" onclick="rejectDeposit(${d.id})">Reject</button>
                            </td>
                        </tr>
                    `;
                });
            } catch (e) { console.error(e); }
        }

        async function fetchWithdrawals() {
            try {
                const res = await fetch(`${API_URL}/api/admin/pending-withdrawals`, { headers: authHeaders() });
                const data = await res.json();
                const tbody = document.getElementById("withdrawals-tbody");
                tbody.innerHTML = "";
                
                if (data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;">No pending withdrawals</td></tr>`;
                    return;
                }

                data.forEach(w => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${w.id}</td>
                            <td>${w.telegram_id}</td>
                            <td>${w.amount} ETB</td>
                            <td>${w.method}</td>
                            <td>${w.account_details}</td>
                            <td>
                                <button class="btn btn-success" onclick="approveWithdrawal(${w.id})">Approve</button>
                                <button class="btn btn-danger" onclick="rejectWithdrawal(${w.id})">Reject</button>
                            </td>
                        </tr>
                    `;
                });
            } catch (e) { console.error(e); }
        }

        async function fetchHistory() {
            try {
                const res = await fetch(`${API_URL}/api/admin/transactions`, { headers: authHeaders() });
                const data = await res.json();
                const tbody = document.getElementById("history-tbody");
                tbody.innerHTML = "";
                
                data.forEach(t => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${t.id}</td>
                            <td>${t.type}</td>
                            <td>${t.user}</td>
                            <td>${t.amount} ETB</td>
                            <td>${t.method}</td>
                            <td>${t.status}</td>
                            <td>${new Date(t.date).toLocaleString()}</td>
                        </tr>
                    `;
                });
            } catch (e) { console.error(e); }
        }

        async function fetchSettings() {
            try {
                const res = await fetch(`${API_URL}/api/admin/settings`, { headers: authHeaders() });
                const data = await res.json();
                
                document.getElementById("set-bonus").value = data.registration_bonus || "";
                document.getElementById("set-comm").value = data.commission_rate || "";
                document.getElementById("set-cbe-name").value = data.cbe_account_name || "";
                document.getElementById("set-cbe-num").value = data.cbe_account_number || "";
                document.getElementById("set-tb-num").value = data.telebirr_phone || "";
            } catch (e) { console.error(e); }
        }

        async function approveDeposit(id) {
            await fetch(`${API_URL}/api/admin/approve-deposit/${id}`, { method: "POST", headers: authHeaders() });
            alert("Deposit Approved");
            fetchDeposits();
        }

        async function rejectDeposit(id) {
            await fetch(`${API_URL}/api/admin/reject-deposit/${id}`, { method: "POST", headers: authHeaders() });
            alert("Deposit Rejected");
            fetchDeposits();
        }

        async function approveWithdrawal(id) {
            await fetch(`${API_URL}/api/admin/approve-withdrawal/${id}`, { method: "POST", headers: authHeaders() });
            alert("Withdrawal Approved");
            fetchWithdrawals();
        }

        async function rejectWithdrawal(id) {
            await fetch(`${API_URL}/api/admin/reject-withdrawal/${id}`, { method: "POST", headers: authHeaders() });
            alert("Withdrawal Rejected");
            fetchWithdrawals();
        }

        async function saveSettings() {
            const payload = {
                registration_bonus: parseFloat(document.getElementById("set-bonus").value),
                commission_rate: parseFloat(document.getElementById("set-comm").value),
                cbe_account_name: document.getElementById("set-cbe-name").value,
                cbe_account_number: document.getElementById("set-cbe-num").value,
                telebirr_phone: document.getElementById("set-tb-num").value
            };
            
            await fetch(`${API_URL}/api/admin/settings`, {
                method: "POST",
                headers: authHeaders(),
                body: JSON.stringify(payload)
            });
            alert("Settings Saved!");
        }
    </script>
</body>
</html>
